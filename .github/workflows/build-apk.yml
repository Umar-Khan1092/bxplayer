name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      # Hide API folder because Next.js static export crashes on dynamic API routes
      - name: Temporarily hide API routes for static build
        run: mv src/app/api src/app/_api_temp

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_API_URL: https://bxplayer.vercel.app
        run: npm run build:cap

      - name: Prevent APK inception (Remove APK from assets before sync)
        run: rm -f out/*.apk

      - name: Restore API routes
        run: mv src/app/_api_temp src/app/api

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Auto-update APK in public folder
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app-release.apk
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/app-release.apk
          git commit -m "chore: Auto-update APK from latest build [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BXPlayer-APK
          path: public/app-release.apk
